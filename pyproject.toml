[project]
name = "examind-api"
version = "0.1.0"
description = "EXAMIND FastAPI Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "cryptography>=44.0.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "websockets>=14.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
# Pins today's behavior (loop scope follows each fixture's own scope).
# "fixture-scope" exists only in pytest-asyncio >= 1.5.0 — see the
# pytest-asyncio>=1.5.0 floor in dependencies; 1.4.x rejects it at
# configure time. The suite has no async fixtures, so this only
# silences the unset-scope deprecation warning.
asyncio_default_fixture_loop_scope = "fixture-scope"
